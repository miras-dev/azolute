name: Deploy to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Assets go up before the HTML that references them: a page must never
      # point at a new ?v= URL whose file is not uploaded yet, or the old file
      # gets cached under the new URL for a year.
      - name: Deploy assets (long-cache)
        run: |
          aws s3 sync . s3://${{ secrets.S3_BUCKET }} \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "data/*" \
            --exclude ".claude/*" \
            --exclude "scripts/*" \
            --exclude "docs/*" \
            --exclude "img/landing/raw/*" \
            --exclude "img/landing2/raw/*" \
            --exclude "stash/*" \
            --exclude "*.html" \
            --exclude "*.log" \
            --exclude ".env*" \
            --cache-control "public, max-age=31536000, immutable"

      # data/*.json is live data an n8n cron overwrites (e.g. data/stats.json):
      # it must never get the one-year immutable cache of the assets step.
      - name: Deploy live data (no-cache)
        run: |
          aws s3 sync . s3://${{ secrets.S3_BUCKET }} \
            --exclude "*" \
            --include "data/*.json" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/json"

      - name: Deploy HTML files (no-cache)
        run: |
          aws s3 sync . s3://${{ secrets.S3_BUCKET }} \
            --delete \
            --exclude "*" \
            --include "*.html" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "stash/*" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
